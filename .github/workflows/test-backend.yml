name: Backend tests

# Runs the backend pytest suite (including the new guacd-handshake and
# managed-host power-endpoint tests) against real Postgres + Redis service
# containers, so the Connect-mode bridge logic and the power toolbar are
# exercised in CI on every backend change - no VM deployment required.

on:
  push:
    branches: [main, remote-management-rebuild]
    paths:
      - "backend/**"
      - ".github/workflows/test-backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deploycore
          POSTGRES_PASSWORD: deploycore
          POSTGRES_DB: deploycore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deploycore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      # Must be a valid Fernet key (32 url-safe base64 bytes) - app/security/
      # crypto.py uses APP_SECRET_KEY directly as one. This is a throwaway
      # all-zeros key for CI only.
      APP_SECRET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATABASE_URL: postgresql+asyncpg://deploycore:deploycore@localhost:5432/deploycore
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend + test deps
        run: pip install -e ".[test]"

      # Scoped to the Remote Management tests this workflow exists to gate (the
      # guacd Connect-mode handshake and the power endpoints). The full backend
      # suite has pre-existing CI-environment needs unrelated to this feature
      # (mtools for the floppy builder, a writable /data, etc.) and has never
      # had a CI workflow - retrofitting that is a separate task.
      - name: Run Remote Management tests
        run: pytest -q tests/test_remote_session_guacd.py tests/test_managed_hosts_power.py
