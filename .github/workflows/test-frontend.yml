name: Frontend build

# Typechecks + builds the frontend (npm run build = `tsc -b && vite build`), so
# the Remote Management UI changes - the ESXi-style PowerMenu, the Connect-mode
# tunnel wiring, and the guacamole-common-js ambient types - are validated in CI
# rather than only discovered when the app is rebuilt on a deployment.

on:
  push:
    branches: [main, remote-management-rebuild]
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm install`, not `npm ci`, to match frontend/Dockerfile exactly (it
      # copies only package.json and runs `npm install`). The committed
      # package-lock.json is stale/unused for the real build, so `npm ci` (which
      # demands an in-sync lock) would fail on something deployment never hits.
      - name: Install
        run: npm install
      - name: Typecheck + build
        run: npm run build
