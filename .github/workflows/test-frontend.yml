name: Frontend build

# Typechecks + builds the frontend (npm run build = `tsc -b && vite build`), so
# the Remote Management UI changes - the ESXi-style PowerMenu, the Connect-mode
# tunnel wiring, and the guacamole-common-js ambient types - are validated in CI
# rather than only discovered when the app is rebuilt on a deployment.

on:
  push:
    branches: [main, remote-management-rebuild]
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + build
        run: npm run build
